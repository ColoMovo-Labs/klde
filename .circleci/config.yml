version: 2.1

executors:
  ubuntu-qt:
    docker:
      - image: ubuntu:26.04
    resource_class: medium
    working_directory: /root/project
    environment:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CCACHE_DIR: /root/.cache/ccache
      CCACHE_BASEDIR: /root/project

commands:
  prepare:
    steps:
      - run:
          name: Install checkout tools
          command: |
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git openssh-client
      - checkout
      - restore_cache:
          keys:
            - apt-v1-26.04-{{ arch }}-{{ checksum ".circleci/packages.txt" }}
      - run:
          name: Install distribution Qt and validation tools
          command: |
            rm -f /etc/apt/apt.conf.d/docker-clean
            xargs -a .circleci/packages.txt apt-get install -y --no-install-recommends
            mkdir -p artifacts/environment artifacts/tests
            dpkg-query -W > artifacts/environment/packages.txt
            cmake --version > artifacts/environment/cmake.txt
            qmake6 -query > artifacts/environment/qt.txt
            clang-format --version > artifacts/environment/clang-format.txt
      - save_cache:
          key: apt-v1-26.04-{{ arch }}-{{ checksum ".circleci/packages.txt" }}
          paths:
            - /var/cache/apt/archives
  built-tree:
    steps:
      - prepare
      - attach_workspace:
          at: /root/project

jobs:
  configure-build:
    executor: ubuntu-qt
    steps:
      - prepare
      - restore_cache:
          keys:
            - ccache-v1-26.04-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-26.04-{{ arch }}-{{ .Branch }}-
            - ccache-v1-26.04-{{ arch }}-
      - run:
          name: Configure and build
          command: |
            cmake --preset ci -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build --preset ci --parallel 2
            ccache --show-stats > artifacts/environment/ccache.txt
      - save_cache:
          key: ccache-v1-26.04-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - /root/.cache/ccache
      - persist_to_workspace:
          root: /root/project
          paths:
            - build/ci
      - store_artifacts:
          path: artifacts/environment

  static-analysis:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Format, license, QML and C++ analysis
          command: |
            bash tools/check-format.sh
            reuse lint
            cmake --build build/ci --target all_qmllint --parallel 2
            clang-tidy -p build/ci src/shell/main.cpp
            desktop-file-validate packaging/org.klde.shell.preview.desktop
      - store_artifacts:
          path: artifacts/environment

  unit-tests:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Qt Test startup contract
          command: ctest --test-dir build/ci -L unit --output-on-failure --output-junit artifacts/tests/unit.xml
      - store_test_results:
          path: artifacts/tests

  qml-tests:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Qt Quick Test token contract
          command: ctest --test-dir build/ci -L qml --output-on-failure --output-junit artifacts/tests/qml.xml
      - store_test_results:
          path: artifacts/tests

  integration-smoke:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Offscreen, nested Wayland and llvmpipe startup
          command: bash tools/smoke-test.sh build/ci/bin/klde-shell
      - store_artifacts:
          path: artifacts/smoke

  packaging-check:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Stage install archive
          command: |
            DESTDIR="$PWD/artifacts/install" cmake --install build/ci --prefix /usr
            test -x artifacts/install/usr/bin/klde-shell
            desktop-file-validate artifacts/install/usr/share/applications/org.klde.shell.preview.desktop
            tar -C artifacts/install -czf artifacts/klde-install-tree.tar.gz .
      - store_artifacts:
          path: artifacts/klde-install-tree.tar.gz

  fedora-build:
    docker:
      - image: fedora:44
    resource_class: medium
    working_directory: /root/project
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - run:
          name: Install Fedora checkout and Qt tools
          command: dnf install -y --setopt=install_weak_deps=False ca-certificates git openssh-clients cmake ninja-build gcc-c++ qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtbase-gui qt6-qtdeclarative qt6-qtwayland dejavu-sans-fonts mesa-dri-drivers mesa-libEGL mesa-libGL
      - checkout
      - run:
          name: Build and test the current GitHub baseline on Fedora
          command: |
            cmake -S . -B build/fedora -G Ninja -DBUILD_TESTING=ON
            cmake --build build/fedora --parallel 2
            mkdir -p artifacts/fedora
            ctest --test-dir build/fedora --output-on-failure --output-junit artifacts/fedora/tests.xml
      - store_test_results:
          path: artifacts/fedora

  deb-runtime:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Install Debian package validation tools
          command: apt-get install -y --no-install-recommends dpkg-dev
      - run:
          name: Build, install, run and purge the baseline DEB
          command: |
            set -eu
            stage="$PWD/artifacts/runtime-deb/stage"
            mkdir -p "$stage/DEBIAN" artifacts/runtime-deb debian
            DESTDIR="$stage" cmake --install build/ci --prefix /usr
            printf 'Source: klde-ci-runtime-check\nSection: x11\nPriority: optional\nMaintainer: owoDE contributors\n\nPackage: klde-ci-runtime-check\nArchitecture: any\nDescription: Isolated baseline runtime validation\n' > debian/control
            dependencies=$(dpkg-shlibdeps -O -e"$stage/usr/bin/klde-shell" | sed -n 's/^shlibs:Depends=//p')
            test -n "$dependencies"
            printf 'Package: klde-ci-runtime-check\nVersion: 0.1.0-0.git%s\nArchitecture: %s\nMaintainer: owoDE contributors\nDepends: %s\nDescription: Isolated baseline runtime validation\n' "$(git rev-parse --short HEAD)" "$(dpkg --print-architecture)" "$dependencies" > "$stage/DEBIAN/control"
            dpkg-deb --build "$stage" artifacts/runtime-deb/klde-ci-runtime-check.deb
            apt-get install -y "$PWD/artifacts/runtime-deb/klde-ci-runtime-check.deb"
            mkdir -p artifacts/runtime-deb/runtime
            chmod 700 artifacts/runtime-deb/runtime
            XDG_RUNTIME_DIR="$PWD/artifacts/runtime-deb/runtime" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 20s /usr/bin/klde-shell --smoke-test --capture "$PWD/artifacts/runtime-deb/installed.png"
            test -s artifacts/runtime-deb/installed.png
            dpkg --purge klde-ci-runtime-check
            test ! -e /usr/bin/klde-shell
      - store_artifacts:
          path: artifacts/runtime-deb/installed.png

workflows:
  core:
    jobs:
      - configure-build
      - fedora-build
      - deb-runtime:
          requires: [packaging-check]
      - static-analysis:
          requires: [configure-build]
      - unit-tests:
          requires: [configure-build]
      - qml-tests:
          requires: [configure-build]
      - integration-smoke:
          requires: [configure-build]
      - packaging-check:
          requires: [configure-build]
