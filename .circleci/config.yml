version: 2.1

executors:
  ubuntu-qt:
    docker:
      - image: ubuntu:26.04
    resource_class: medium
    working_directory: /root/project
    environment:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CCACHE_DIR: /root/.cache/ccache
      CCACHE_BASEDIR: /root/project

  fedora-qt:
    docker:
      - image: fedora:44
    resource_class: medium
    working_directory: /root/project
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      CCACHE_DIR: /root/.cache/ccache
      CCACHE_BASEDIR: /root/project

commands:
  prepare:
    steps:
      - run:
          name: Install checkout tools
          command: |
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git openssh-client
      - checkout
      - restore_cache:
          keys:
            - apt-v1-26.04-{{ arch }}-{{ checksum ".circleci/packages.txt" }}
      - run:
          name: Install distribution Qt and validation tools
          command: |
            rm -f /etc/apt/apt.conf.d/docker-clean
            xargs -a .circleci/packages.txt apt-get install -y --no-install-recommends
            mkdir -p artifacts/environment artifacts/tests
            dpkg-query -W > artifacts/environment/packages.txt
            cmake --version > artifacts/environment/cmake.txt
            qmake6 -query > artifacts/environment/qt.txt
            clang-format --version > artifacts/environment/clang-format.txt
      - save_cache:
          key: apt-v1-26.04-{{ arch }}-{{ checksum ".circleci/packages.txt" }}
          paths:
            - /var/cache/apt/archives
  built-tree:
    steps:
      - prepare
      - attach_workspace:
          at: /root/project

jobs:
  fedora-login-vm:
    machine:
      image: ubuntu-2604:current
    resource_class: medium
    environment:
      OWODE_VM_CLOUD_ONLY: "1"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install disposable cloud guest orchestration tools
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils openssh-client gnupg curl python3
      - run:
          name: Real Fedora GDM, logind, virtual DRM and return to greeter
          no_output_timeout: 20m
          command: timeout --signal=TERM --kill-after=30s 45m python3 tools/cloud-login-vm.py --packages artifacts/fedora-package --output artifacts/login-vm
      - store_artifacts:
          path: artifacts/login-vm

  native-ubuntu:
    executor: ubuntu-qt
    steps:
      - built-tree
      - restore_cache:
          keys:
            - ccache-v1-26.04-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-26.04-{{ arch }}-{{ .Branch }}-
      - run:
          name: Install isolated KWin and native test dependencies
          command: apt-get install -y --no-install-recommends kwin-wayland libwayland-dev libwayland-bin pkg-config imagemagick xdotool dbus-daemon dbus-bin libkf6service-bin
      - run:
          name: Build native integration tools against Ubuntu LayerShellQt
          command: |
            cmake -S . -B build/ci -DOWODE_BUILD_NATIVE_TESTS=ON
            cmake --build build/ci --target klde-native-session-test owode-native-test-client owode-native-capture --parallel 2
            mkdir -p artifacts/native-session
            tar -C build/ci/bin -czf artifacts/native-session/native-audit-tools.tar.gz klde-native-session-test owode-native-test-client owode-native-capture
            git archive --format=tar.gz --prefix=owode-native-source/ HEAD > artifacts/native-session/native-audit-source.tar.gz
      - run:
          name: Verify native KWin roles, input, focus and maximization
          command: |
            for native_run in 1 2 3; do
              native_output=artifacts/native-session
              if [[ "$native_run" != 1 ]]; then native_output="$native_output/repeat-$native_run"; fi
              bash tools/native-session-smoke.sh build/ci "$native_output"
            done
            printf '%s\n' '3 fresh isolated KWin runs passed.' > artifacts/native-session/repeat-acceptance.txt
      - run:
          name: Verify per-output surfaces with a two-output nested KWin
          command: bash tools/multi-output-smoke.sh build/ci artifacts/native-session/multi-output
      - store_test_results:
          path: artifacts/native-session
      - store_artifacts:
          path: artifacts/native-session

  native-fedora:
    executor: fedora-qt
    steps:
      - run:
          name: Install Fedora checkout tools
          command: dnf install -y --setopt=install_weak_deps=False ca-certificates git openssh-clients tar gzip findutils
      - checkout
      - restore_cache:
          keys:
            - dnf-v1-fedora44-{{ arch }}-{{ checksum ".circleci/fedora-packages.txt" }}
      - run:
          name: Install Fedora Qt and isolated KWin tools
          command: |
            xargs -a .circleci/fedora-packages.txt dnf install -y --setopt=install_weak_deps=False
            dnf install -y --setopt=install_weak_deps=False kwin xorg-x11-server-Xvfb xorg-x11-xauth ImageMagick xdotool mesa-dri-drivers mesa-libEGL mesa-libGL pkgconf-pkg-config dbus-daemon dbus-tools kf6-kservice
      - attach_workspace:
          at: /root/project
      - restore_cache:
          keys:
            - ccache-v1-fedora44-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-fedora44-{{ arch }}-{{ .Branch }}-
      - run:
          name: Build native integration tools against Fedora LayerShellQt
          command: |
            cmake -S . -B build/fedora -DOWODE_BUILD_NATIVE_TESTS=ON
            cmake --build build/fedora --target klde-native-session-test owode-native-test-client owode-native-capture --parallel 2
            mkdir -p artifacts/native-session
            tar -C build/fedora/bin -czf artifacts/native-session/native-audit-tools.tar.gz klde-native-session-test owode-native-test-client owode-native-capture
            git archive --format=tar.gz --prefix=owode-native-source/ HEAD > artifacts/native-session/native-audit-source.tar.gz
      - run:
          name: Verify installed Fedora login client, Xwayland and owned logout
          command: |
            dnf install -y --setopt=install_weak_deps=False gnome-calculator kcalc adwaita-icon-theme breeze-icon-theme
            dnf install -y artifacts/fedora-package/*.rpm
            bash tools/login-session-smoke.sh build/fedora artifacts/login-session
            dnf remove -y owode-session
            test ! -e /usr/share/wayland-sessions/owode.desktop
            test ! -e /usr/bin/start-owode
      - store_artifacts:
          path: artifacts/login-session
      - run:
          name: Verify native KWin roles, input, focus and maximization
          command: |
            for native_run in 1 2 3; do
              native_output=artifacts/native-session
              if [[ "$native_run" != 1 ]]; then native_output="$native_output/repeat-$native_run"; fi
              bash tools/native-session-smoke.sh build/fedora "$native_output"
            done
            printf '%s\n' '3 fresh isolated KWin runs passed.' > artifacts/native-session/repeat-acceptance.txt
      - run:
          name: Verify per-output surfaces with a two-output nested KWin
          command: bash tools/multi-output-smoke.sh build/fedora artifacts/native-session/multi-output
      - store_test_results:
          path: artifacts/native-session
      - store_artifacts:
          path: artifacts/native-session

  calculator-ubuntu:
    executor: ubuntu-qt
    steps:
      - prepare
      - run:
          name: Build and verify the independent Lingmo calculator port
          command: bash tools/cloud-calculator.sh
      - store_test_results:
          path: artifacts/calculator
      - store_artifacts:
          path: artifacts/calculator

  calculator-fedora:
    executor: fedora-qt
    steps:
      - run:
          name: Install Fedora checkout tools
          command: dnf install -y --setopt=install_weak_deps=False ca-certificates git openssh-clients tar gzip findutils
      - checkout
      - restore_cache:
          keys:
            - dnf-v1-fedora44-{{ arch }}-{{ checksum ".circleci/fedora-packages.txt" }}
      - run:
          name: Install Fedora development modules
          command: xargs -a .circleci/fedora-packages.txt dnf install -y --setopt=install_weak_deps=False
      - run:
          name: Build and verify the independent Lingmo calculator port
          command: bash tools/cloud-calculator.sh
      - store_test_results:
          path: artifacts/calculator
      - store_artifacts:
          path: artifacts/calculator

  configure-build:
    executor: ubuntu-qt
    steps:
      - prepare
      - restore_cache:
          keys:
            - ccache-v1-26.04-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-26.04-{{ arch }}-{{ .Branch }}-
            - ccache-v1-26.04-{{ arch }}-
      - run:
          name: Configure and build
          command: |
            cmake --preset ci -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build --preset ci --parallel 2
            ccache --show-stats > artifacts/environment/ccache.txt
      - save_cache:
          key: ccache-v1-26.04-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - /root/.cache/ccache
      - persist_to_workspace:
          root: /root/project
          paths:
            - build/ci
      - store_artifacts:
          path: artifacts/environment

  designer-compat:
    executor: fedora-qt
    steps:
      - run:
          name: Install QML Designer runtime and isolated X server
          command: dnf install -y --setopt=install_weak_deps=False git openssh-clients qt-creator qt6-qtsvg mesa-dri-drivers mesa-libGL mesa-libEGL xorg-x11-server-Xvfb xorg-x11-xauth google-noto-sans-cjk-vf-fonts
      - checkout
      - run:
          name: Render every form scene with QML Designer's own renderer
          command: bash tools/check-designer-renderer.sh artifacts/designer
      - store_artifacts:
          path: artifacts/designer

  static-analysis:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Format, license, QML and C++ analysis
          command: |
            bash tools/check-format.sh
            reuse lint
            python3 tools/check-design-workspace.py
            python3 tools/check-translations.py
            python3 tools/check-fcitx-theme.py
            cmake --build build/ci --target all_qmllint --parallel 2
            bash tools/check-tidy.sh
            desktop-file-validate packaging/org.klde.shell.preview.desktop
      - store_artifacts:
          path: artifacts/environment

  unit-tests:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Qt Test backend and startup contracts
          command: ctest --test-dir build/ci -L unit --output-on-failure --output-junit artifacts/tests/unit.xml
      - store_test_results:
          path: artifacts/tests

  qml-tests:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Qt Quick Test tokens and launcher keyboard interaction
          command: ctest --test-dir build/ci -L qml --output-on-failure --output-junit artifacts/tests/qml.xml
      - store_test_results:
          path: artifacts/tests

  integration-smoke:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Shared visual workspace without shell backends
          command: |
            xvfb-run -a env QT_QPA_PLATFORM=xcb QT_QUICK_BACKEND=software QT_QUICK_CONTROLS_STYLE=Basic OWODE_DESIGN_CAPTURES=artifacts/smoke/design build/ci/bin/owode-design-workspace-test
      - run:
          name: Default fusion materials through OpenGL
          command: bash tools/capture-fusion-previews.sh build/ci/bin/klde-shell artifacts/fusion
      - store_artifacts:
          path: artifacts/fusion
      - run:
          name: Offscreen, nested Wayland and llvmpipe startup
          command: bash tools/smoke-test.sh build/ci/bin/klde-shell
      - run:
          name: Locale, voice, state and responsive visual matrix
          command: |
            runtime_dir="$(mktemp -d)"
            chmod 700 "$runtime_dir"
            trap 'rm -rf "$runtime_dir"' EXIT
            xvfb-run -a -s '-screen 0 3840x2160x24' env -u QT_QUICK_BACKEND \
              XDG_RUNTIME_DIR="$runtime_dir" QT_QPA_PLATFORM=xcb QSG_RHI_BACKEND=opengl \
              LIBGL_ALWAYS_SOFTWARE=1 python3 tools/visual-matrix.py build/ci/bin/klde-shell
      - store_artifacts:
          path: artifacts/smoke

  fedora-build:
    executor: fedora-qt
    steps:
      - run:
          name: Install Fedora checkout tools
          command: dnf install -y --setopt=install_weak_deps=False ca-certificates git openssh-clients tar gzip findutils
      - checkout
      - restore_cache:
          keys:
            - dnf-v1-fedora44-{{ arch }}-{{ checksum ".circleci/fedora-packages.txt" }}
      - run:
          name: Install Fedora Qt development and runtime modules
          command: |
            xargs -a .circleci/fedora-packages.txt dnf install -y --setopt=install_weak_deps=False --setopt=keepcache=True
            mkdir -p artifacts/environment artifacts/tests artifacts/fedora-smoke
            rpm -qa | sort > artifacts/environment/packages.txt
            cmake --version > artifacts/environment/cmake.txt
            qmake6 -query > artifacts/environment/qt.txt
      - save_cache:
          key: dnf-v1-fedora44-{{ arch }}-{{ checksum ".circleci/fedora-packages.txt" }}
          paths:
            - /var/cache/libdnf5
      - restore_cache:
          keys:
            - ccache-v1-fedora44-{{ arch }}-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-fedora44-{{ arch }}-{{ .Branch }}-
            - ccache-v1-fedora44-{{ arch }}-
      - run:
          name: Independently configure and build on Fedora
          command: |
            cmake --preset ci -B build/fedora -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build build/fedora --parallel 2
            ccache --show-stats > artifacts/environment/ccache.txt
      - run:
          name: Fedora format and static analysis with LayerShellQt
          command: |
            clang-format --version > artifacts/environment/fedora-clang-format.txt
            clang-tidy --version > artifacts/environment/fedora-clang-tidy.txt
            CHECK_CPP_ONLY=1 bash tools/check-format.sh
            BUILD_DIR=build/fedora bash tools/check-tidy.sh
      - run:
          name: Fedora unit, QML and offscreen startup tests
          command: |
            ctest --test-dir build/fedora --output-on-failure --output-junit artifacts/tests/fedora.xml
            runtime_dir="$(mktemp -d)"
            chmod 700 "$runtime_dir"
            trap 'rm -rf "$runtime_dir"' EXIT
            env XDG_RUNTIME_DIR="$runtime_dir" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
              build/fedora/bin/klde-shell --smoke-test --view quick-settings \
              --capture "$PWD/artifacts/fedora-smoke/offscreen.png" \
              > artifacts/fedora-smoke/offscreen.log 2>&1
            test -s artifacts/fedora-smoke/offscreen.png
            desktop-file-validate packaging/org.klde.shell.preview.desktop
      - run:
          name: Package Fedora user bundle
          command: bash tools/package-fedora-bundle.sh build/fedora artifacts/fedora-package
      - run:
          name: Verify Fedora RPM installation
          command: |
            dnf install -y artifacts/fedora-package/*.rpm
            rpm -q klde-shell-preview
            test -x /usr/bin/klde-shell
            runtime_dir="$(mktemp -d)"
            chmod 700 "$runtime_dir"
            trap 'rm -rf "$runtime_dir"' EXIT
            env XDG_RUNTIME_DIR="$runtime_dir" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
              /usr/bin/klde-shell --smoke-test --view quick-settings \
              --capture "$PWD/artifacts/fedora-smoke/installed-rpm.png" \
              > artifacts/fedora-smoke/installed-rpm.log 2>&1
            test -s artifacts/fedora-smoke/installed-rpm.png
      - save_cache:
          key: ccache-v1-fedora44-{{ arch }}-{{ .Branch }}-{{ .Revision }}
          paths:
            - /root/.cache/ccache
      - persist_to_workspace:
          root: /root/project
          paths:
            - build/fedora
            - artifacts/fedora-package
      - store_test_results:
          path: artifacts/tests
      - store_artifacts:
          path: artifacts/environment
      - store_artifacts:
          path: artifacts/fedora-smoke
      - store_artifacts:
          path: artifacts/fedora-package

  packaging-check:
    executor: ubuntu-qt
    steps:
      - built-tree
      - run:
          name: Build the experimental Debian package and matching source archive
          command: bash tools/package-deb.sh build/ci
      - persist_to_workspace:
          root: /root/project
          paths:
            - artifacts/packages
      - store_artifacts:
          path: artifacts/packages

  deb-runtime:
    executor: ubuntu-qt
    steps:
      - run:
          name: Prepare a clean Ubuntu runtime container
          command: |
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates git openssh-client desktop-file-utils xvfb xauth mesa-utils libegl-mesa0 libgl1-mesa-dri libglx-mesa0
      - checkout
      - attach_workspace:
          at: /root/project
      - run:
          name: Install the package through apt with only declared runtime dependencies
          command: |
            # Apply after the image's docker filters (dpkg reads files lexicographically).
            # Retain this package's directory and all license documents.
            mkdir -p /etc/dpkg/dpkg.cfg.d
            printf '%s\n' 'path-include=/usr/share/doc/klde-shell-preview' 'path-include=/usr/share/doc/klde-shell-preview/*' > /etc/dpkg/dpkg.cfg.d/zz-klde-docs
            apt-get install -y --no-install-recommends ./artifacts/packages/*.deb
      - run:
          name: Exercise the installed shell and verify clean removal
          command: bash tools/check-deb-runtime.sh
      - store_artifacts:
          path: artifacts/package-runtime

workflows:
  core:
    jobs:
      - calculator-ubuntu:
          filters:
            branches:
              ignore: feat/native-session-surfaces
      - calculator-fedora:
          filters:
            branches:
              ignore: feat/native-session-surfaces
      - designer-compat
      - configure-build
      - fedora-build
      - fedora-login-vm:
          requires: [fedora-build]
          filters:
            branches:
              only: [feat/fedora-gdm-vm, feat/session-activation-env]
      - native-ubuntu:
          requires: [configure-build]
      - native-fedora:
          requires: [fedora-build]
      - static-analysis:
          requires: [configure-build]
      - unit-tests:
          requires: [configure-build]
      - qml-tests:
          requires: [configure-build]
      - integration-smoke:
          requires: [configure-build]
      - packaging-check:
          requires: [configure-build]
      - deb-runtime:
          requires: [packaging-check]
