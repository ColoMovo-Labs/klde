name: Feature proposal
description: Propose an observable improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Include keyboard/accessibility behavior and backend capabilities where relevant.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and evidence
      description: Current roadmap phase, dependencies and any prototype evidence.
