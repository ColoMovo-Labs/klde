# CNB is a public mirror and an additional Fedora cloud validation path.
# CircleCI remains the authoritative Qt/CMake matrix and merge check.
"(main|feat/temporal-shell|feat/native-session-surfaces|feat/visual-workspace|feat/system-applications|feat/fedora-login-session|feat/kwin-live-state|feat/live-system-services)":
  push:
    - docker:
        image: fedora:44
      stages:
        - name: install Fedora Qt toolchain
          script: |
            set -eu
            # The default metalink picks overseas mirrors, which made this stage
            # take ~47 minutes on CNB. Tencent's Fedora mirror is in-region.
            for repo in /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora-updates.repo; do
              sed -i -e 's|^metalink=|#metalink=|' \
                -e 's|^#baseurl=http://download.example/pub/fedora/linux|baseurl=https://mirrors.cloud.tencent.com/fedora|' \
                "$repo"
            done
            # Cisco's openh264 CDN is not mirrored and can stall later dnf calls
            # past CNB's 10-minute no-output limit; no build step needs it.
            sed -i 's/^enabled=1/enabled=0/' /etc/yum.repos.d/fedora-cisco-openh264.repo
            dnf install -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 \
              @development-tools cmake ninja-build git file findutils rpm-build python3 \
              clang clang-tools-extra \
              qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtshadertools-devel qt6-qtwayland-devel \
              qt6-qtsvg qt6-qttools-devel layer-shell-qt layer-shell-qt-devel \
              kf6-kio-devel kf6-kservice-devel kf6-networkmanager-qt-devel kf6-bluez-qt-devel pulseaudio-qt-qt6-devel kf6-kconfig-devel \
              wayland-devel wayland-protocols-devel mesa-dri-drivers \
              mesa-libEGL mesa-libGL dbus-daemon dbus-tools python3-dbus python3-dbusmock \
              dejavu-sans-fonts google-noto-sans-cjk-vf-fonts \
              google-noto-color-emoji-fonts \
              desktop-file-utils xorg-x11-server-Xvfb xorg-x11-xauth glx-utils
        - name: configure and build
          script: |
            set -eu
            cmake -S . -B build/cnb -G Ninja -DBUILD_TESTING=ON -DOWODE_REQUIRE_SYSTEM_APPLICATIONS=ON
            cmake --build build/cnb --parallel "$(nproc)"
        - name: run Qt and QML tests
          script: |
            set -eu
            ctest --test-dir build/cnb --output-on-failure
        - name: Fedora format and static analysis with LayerShellQt
          script: |
            set -eu
            CHECK_CPP_ONLY=1 bash tools/check-format.sh
            BUILD_DIR=build/cnb bash tools/check-tidy.sh
        - name: capture Monet visual previews
          script: |
            set -eu
            mkdir -p artifacts/visual
            runtime_dir="$(mktemp -d)"
            chmod 700 "$runtime_dir"
            trap 'rm -rf "$runtime_dir"' EXIT
            for wallpaper in snow abstract quiet kemono; do
              env XDG_RUNTIME_DIR="$runtime_dir" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
                build/cnb/bin/klde-shell --smoke-test --view desktop \
                --wallpaper "$wallpaper" --capture "artifacts/visual/monet-light-${wallpaper}.png" \
                > "artifacts/visual/monet-light-${wallpaper}.log" 2>&1
            done
            env XDG_RUNTIME_DIR="$runtime_dir" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
              build/cnb/bin/klde-shell --smoke-test --view desktop --dark --wallpaper kemono \
              --capture artifacts/visual/monet-dark-kemono.png \
              > artifacts/visual/monet-dark-kemono.log 2>&1
            env XDG_RUNTIME_DIR="$runtime_dir" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
              build/cnb/bin/klde-shell --smoke-test --view material-study \
              --capture artifacts/visual/material-study-light.png \
              > artifacts/visual/material-study-light.log 2>&1
            env XDG_RUNTIME_DIR="$runtime_dir" QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
              build/cnb/bin/klde-shell --smoke-test --view material-study --dark --wallpaper kemono \
              --capture artifacts/visual/material-study-dark-kemono.png \
              > artifacts/visual/material-study-dark-kemono.log 2>&1
            sha256sum artifacts/visual/*.png > artifacts/visual/SHA256SUMS
            find artifacts/visual -maxdepth 1 -type f -empty -delete
            test -s artifacts/visual/monet-light-snow.png
            test -s artifacts/visual/monet-dark-kemono.png
            test -s artifacts/visual/material-study-light.png
            test -s artifacts/visual/material-study-dark-kemono.png
        - name: attach Monet visual previews
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./artifacts/visual/*.png"
              - "./artifacts/visual/SHA256SUMS"
        - name: capture default fusion materials through OpenGL
          script: |
            set -eu
            bash tools/capture-fusion-previews.sh build/cnb/bin/klde-shell artifacts/fusion
            # A quiet Qt run leaves an empty log, and the attachment uploader
            # rejects zero-length files (errcode 2000007). The PNGs are checked
            # by the capture script itself.
            find artifacts/fusion -maxdepth 1 -type f -empty -delete
        - name: attach fusion previews and rendering evidence
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./artifacts/fusion/*.png"
              - "./artifacts/fusion/*.log"
              - "./artifacts/fusion/*.json"
              - "./artifacts/fusion/*.txt"
        - name: package Fedora user bundle
          script: |
            set -eu
            bash tools/package-fedora-bundle.sh build/cnb artifacts/fedora-package
            for artifact in artifacts/fedora-package/*.tar.gz artifacts/fedora-package/*.rpm; do
              test -s "$artifact"
            done
        - name: attach Fedora packages
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./artifacts/fedora-package/*.rpm"
              - "./artifacts/fedora-package/*.tar.gz"
              - "./artifacts/fedora-package/SHA256SUMS"
              - "./artifacts/fedora-package/*.txt"
        - name: build and verify the independent Lingmo calculator port
          script: |
            set -eu
            bash tools/cloud-calculator.sh
            find artifacts/calculator -maxdepth 1 -type f -empty -delete
        - name: attach themed calculator and corresponding source
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./artifacts/calculator/*.png"
              - "./artifacts/calculator/*.rpm"
              - "./artifacts/calculator/*.tar.gz"
              - "./artifacts/calculator/*.txt"
              - "./artifacts/calculator/*.log"
              - "./artifacts/calculator/SHA256SUMS"
        - name: verify public repository entry points
          script: |
            set -eu
            test -s README.md
            test -s README.en.md
            test -s .circleci/config.yml
            grep -q 'owoDE' README.md
